# Login app. Build and load the image with auth-app/docker-build.sh.
# Browser paths are under /auth-app. /auth is only the cluster-internal auth-url check.
apiVersion: v1
kind: Service
metadata:
  name: auth-app
spec:
  selector:
    app: auth-app
  ports:
  - port: 8080
    protocol: TCP
    name: http
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-app
  template:
    metadata:
      labels:
        app: auth-app
    spec:
      containers:
      - name: auth-app
        image: auth-app:local
        imagePullPolicy: Never
        env:
        - name: PORT
          value: "8080"
        - name: BASE_PATH
          value: /auth-app
        - name: AFTER_LOGIN_URL
          value: /forgejo/
        # Lab only. Production supplies a different PASSWORD.
        - name: PASSWORD
          value: pass
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-app
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /auth-app
        pathType: Prefix
        backend:
          service:
            name: auth-app
            port:
              number: 8080
      # Forgejo's Sign out posts to {ROOT_URL}/user/logout. Intercept it so this app can clear the login cookie.
      - path: /forgejo/user/logout
        pathType: Exact
        backend:
          service:
            name: auth-app
            port:
              number: 8080
