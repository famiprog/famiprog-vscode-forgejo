<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<meta name="viewport"
		content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
	<title>VSCode Web</title>
	<link rel="stylesheet" href="./node_modules/@github1s/vscode-web/vscode/vs/workbench/workbench.web.main.internal.css" />
</head>

<body>
	<script src="./node_modules/@github1s/vscode-web/vscode/nls.messages.js"></script>
	<script type="module">
		import { boot, setVscodeFileRoot } from './famiprog-vscode-forgejo/dist/web-index-html/index.js';
		import { customizeBootOptions } from './customizeBootOptions.js';

		setVscodeFileRoot('./node_modules/@github1s/vscode-web/vscode/');
		const { URI } = await import(globalThis._VSCODE_FILE_SCRIPT);

		await boot(await customizeBootOptions({
			workbenchConstructionOptions: {
				workspaceProvider: {
					workspace: { workspaceUri: URI.from({ scheme: 'tmp', path: '/default.code-workspace' }) },
				}
			},
			additionalOptions: {
				extensions: [
					{ pathRelativeToIndexHtml: 'famiprog-vscode-forgejo' },
				],
			},
		}));
	</script>
</body>

</html>
