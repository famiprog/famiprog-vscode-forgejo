name: forgejo

networks:
  forgejo:
    external: false

services:
  server:
    image: codeberg.org/forgejo/forgejo:17
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__cors__ENABLED=true
      - "FORGEJO__cors__ALLOW_DOMAIN=*"
    networks:
      - forgejo
    volumes:
      - ./volume-data:/data
      # http://localhost:3001/assets/vscode-web/index.html
      - ../vscode-web-base/node_modules/@github1s/vscode-web:/data/gitea/public/assets/vscode-web:ro
      - ./index.html:/data/gitea/public/assets/vscode-web/index.html:ro
      # http://localhost:3001/assets/famiprog-vscode-forgejo/
      - ../extension:/data/gitea/public/assets/famiprog-vscode-forgejo:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3001:3000"
      - "222:22"
