# https://forgejo.org/docs/latest/admin/installation/docker/
# user/pass: forgejo / forgejoforgejo
name: forgejo

networks:
  forgejo:
    external: false

services:
  server:
    image: codeberg.org/forgejo/forgejo:17
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__cors__ENABLED=true
      - "FORGEJO__cors__ALLOW_DOMAIN=*"
    networks:
      - forgejo
    volumes:
      - ./volume-data:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3001:3000"
      - "222:22"
