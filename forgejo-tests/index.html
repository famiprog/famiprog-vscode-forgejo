<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<meta name="viewport"
		content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
	<title>VSCode Web</title>
	<link rel="stylesheet" href="/assets/vscode-web/vscode/vs/workbench/workbench.web.main.internal.css" />
</head>

<body>
	<script src="/assets/vscode-web/vscode/nls.messages.js"></script>
	<script type="module">
		import { boot, setVscodeFileRoot } from '/assets/famiprog-vscode-forgejo/dist/web-index-html/index.js';

		setVscodeFileRoot('/assets/vscode-web/vscode/');
		const { URI } = await import(globalThis._VSCODE_FILE_SCRIPT);

		await boot({
			workbenchConstructionOptions: {
				workspaceProvider: {
					workspace: { workspaceUri: URI.from({ scheme: 'tmp', path: '/default.code-workspace' }) },
					// trusted: true,
					// workspace: { folderUri: URI.parse(`forgejo://${location.protocol.slice(0, -1)}/${location.host}/forgejo/sample-repo/|`) },
					// open: () => Promise.resolve(false),
				},
				configurationDefaults: {
					'famiprog-vscode-forgejo.embedderUrl': location.origin,
				},
			},
			additionalOptions: {
				extensions: [{ pathRelativeToIndexHtml: '../famiprog-vscode-forgejo' }],
			},
			oauth2Config: {
				clientId: '7e30a448-2d95-469a-87e4-27e44ad1310e',
				redirectPath: '/assets/vscode-web/index.html',
				forgejoOrigin: location.origin,
			},
		});
	</script>
</body>

</html>
